services:
  - type: web
    name: realm-rpg-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix backend install && npm --prefix backend run prisma:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
